name: sampler
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sampler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Lancer le sampler
        env:
          SAMPLER_WEBHOOK_URL: ${{ secrets.SAMPLER_WEBHOOK_URL }}
          SAMPLER_TARGET: '500'
          SAMPLER_CONCURRENCY: '4'
          SAMPLER_MAX_MS: '420000'
          SAMPLER_WINDOW_RUNS: '12'
          SAMPLER_MIN_N: '250'
          SAMPLER_NAMES_URL: 'https://raw.githubusercontent.com/kmljkjj/discord-rollout-sampler/main/data/known_experiment_ids.json'
        run: node src/sampler.js
      - name: Commit l'état
        run: |
          git config user.name "sampler-bot"
          git config user.email "actions@github.com"
          git add data/sampler_state.json
          if git diff --cached --quiet; then
            echo "rien à committer"
          else
            git commit -m "state: run sampler"
            tries=0
            until git push origin HEAD:main; do
              tries=$((tries + 1))
              if [ "$tries" -ge 3 ]; then
                echo "push d'état rejeté 3 fois — abandon"
                exit 1
              fi
              echo "push rejeté — rebase sur main puis retry ($tries/3)"
              git pull --rebase origin main
              sleep 5
            done
          fi
